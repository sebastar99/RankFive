<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Iniciar sesión | Rank5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="d-flex align-items-center">
  <main class="container py-5">
    <div class="row justify-content-center"><div class="col-12 col-md-9 col-lg-6 col-xl-5">
      <a th:href="@{/}" class="navbar-brand justify-content-center text-decoration-none mb-4"><span class="brand-icon">⚽</span> Rank5</a>
      <section class="p-4 p-md-5 rounded-4" style="background: var(--rf-surface); border: 1px solid var(--rf-surface-border); box-shadow: var(--rf-shadow);">
        <p class="text-uppercase small fw-bold mb-2" style="color: var(--rf-primary); letter-spacing: .08em;">Bienvenido de nuevo</p>
        <h1 class="h2 fw-bold mb-2">Iniciá sesión</h1>
        <p class="mb-4" style="color: var(--rf-text-muted);">Accedé a tu cuenta para seguir tu nivel y tus partidos.</p>
        <form th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
          <div class="mb-3"><label for="email" class="form-label fw-semibold">Correo electrónico</label>
            <input th:field="*{email}" id="email" type="email" class="form-control form-control-lg" placeholder="nombre@ejemplo.com" autocomplete="email" required autofocus>
          </div>
          <div class="mb-4"><label for="password" class="form-label fw-semibold">Contraseña</label>
            <input th:field="*{password}" type="password" id="password" class="form-control form-control-lg" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
          </div>
          <p th:if="${error != null}" class="alert alert-danger mb-4" role="alert" th:text="'Error: ' + ${error}"></p>
          <button id="btn-login" class="btn btn-primary btn-lg w-100" type="submit" disabled>Iniciar sesión</button>
        </form>
        <p class="text-center mb-0 mt-4" style="color: var(--rf-text-muted);">¿Todavía no tenés cuenta? <a id="btn-register" th:href="@{/nuevo-usuario}" style="color: var(--rf-primary);">Registrate</a></p>
      </section>
    </div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  <script type="module" th:src="@{/js/login.js}"></script>
</body>
</html>
