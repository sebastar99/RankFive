<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Crear Torneo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css(v=14)}" />
</head>
<body class="dashboard-page">
  <div class="pitch-bg"></div>
  <header class="db-header fixed-top">
    <div class="container">
      <div class="db-header-content">
        <div class="db-left d-flex align-items-center gap-2">
          <a th:href="@{/dashboard}" class="db-brand">
            <span class="db-brand-logo"><i class="bi bi-trophy-fill"></i></span>
            <span class="db-brand-text">Rank<span class="db-brand-accent">5</span></span>
          </a>
        </div>
        <div class="db-center d-flex align-items-center gap-2">
          <span class="db-page-title">Crear Torneo</span>
        </div>
        <div class="db-right d-flex align-items-center gap-4">
          <a th:href="@{/torneos}" class="db-link"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container db-content">
    <section class="card-glass p-4">
      <form th:action="@{/torneos/crear}" method="post" class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" name="nombre" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Ubicación</label>
          <input type="text" class="form-control" name="ubicacion" required>
        </div>
        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" name="descripcion" rows="2"></textarea>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Formato</label>
          <select class="form-select" name="formato" required>
            <option value="5">F5</option>
            <option value="7">F7</option>
            <option value="8">F8</option>
            <option value="9">F9</option>
            <option value="11">F11</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Cupo de equipos</label>
          <input type="number" class="form-control" name="cupoEquipos" min="2" step="2" value="8" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Fecha de inicio</label>
          <input type="date" class="form-control" name="fechaInicio" required>
        </div>
        <div class="col-6 col-md-3 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="inscripcionAbierta" value="true" id="abierta">
            <label class="form-check-label" for="abierta">Inscripción abierta</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Crear</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
