<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Previa del partido | Rank5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css(v=13)}">
</head>
<body class="dashboard-page">
  <div class="pitch-bg"></div>
  <header class="db-header fixed-top">
    <div class="container"><div class="db-header-content">
      <a th:href="@{/dashboard}" class="db-brand"><span class="db-brand-logo"><i class="bi bi-trophy-fill"></i></span><span class="db-brand-text">Rank<span class="db-brand-accent">5</span></span></a>
      <span class="db-page-title"><i class="bi bi-stars"></i>Previa del partido</span>
      <a th:href="@{/partidos}" class="db-link"><i class="bi bi-arrow-left"></i> Partidos</a>
    </div></div>
  </header>
  <main class="container db-content" th:attr="data-previa-url=@{/api/ia/partido/{id}/previa(id=${partido.id})},data-banner-url=@{/api/ia/partido/{id}/banner(id=${partido.id})}">
    <section class="card-glass p-4 p-md-5 mx-auto previa-card">
      <div class="text-center mb-4">
        <span class="rank-badge"><i class="bi bi-dribbble"></i> Partido pendiente</span>
        <h1 class="h3 mt-3">Equipo A <span class="text-primary">vs</span> Equipo B</h1>
        <p class="text-muted mb-0" th:text="${#temporals.format(partido.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</p>
      </div>
      <div id="bannerCargando" class="banner-loading"><div class="spinner-border text-primary" role="status"></div><span>Creando banner del encuentro...</span></div>
      <img id="bannerPartido" class="previa-banner d-none" alt="Banner generado para el partido">
      <div id="bannerError" class="alert alert-secondary d-none"><i class="bi bi-image me-2"></i><span>El banner no pudo generarse, pero la previa está disponible.</span></div>
      <div id="previaCargando" class="text-center py-5 text-muted"><div class="spinner-border text-primary mb-3" role="status"></div><p>Generando la previa del partido...</p></div>
      <article id="previaContenido" class="previa-content d-none"></article>
      <div id="previaError" class="alert alert-warning d-none mb-0"><i class="bi bi-exclamation-triangle me-2"></i>No se pudo generar la previa. Intentá nuevamente en unos instantes.</div>
    </section>
  </main>
  <script>
    (function () {
      const contenedor = document.querySelector('main[data-previa-url]');
      fetch(contenedor.dataset.bannerUrl, { method: 'POST', credentials: 'same-origin' })
        .then(respuesta => respuesta.ok ? respuesta.blob() : respuesta.text().then(error => Promise.reject(error)))
        .then(imagen => {
          document.getElementById('bannerCargando').classList.add('d-none');
          const banner = document.getElementById('bannerPartido');
          banner.src = URL.createObjectURL(imagen);
          banner.classList.remove('d-none');
        })
        .catch(error => {
          document.getElementById('bannerCargando').classList.add('d-none');
          const aviso = document.getElementById('bannerError');
          aviso.querySelector('span').textContent = error || 'El banner no pudo generarse, pero la previa está disponible.';
          aviso.classList.remove('d-none');
        });
      fetch(contenedor.dataset.previaUrl, { method: 'POST', credentials: 'same-origin' })
        .then(respuesta => respuesta.ok ? respuesta.text() : Promise.reject())
        .then(texto => {
          document.getElementById('previaCargando').classList.add('d-none');
          const contenido = document.getElementById('previaContenido');
          contenido.textContent = texto;
          contenido.classList.remove('d-none');
        })
        .catch(() => {
          document.getElementById('previaCargando').classList.add('d-none');
          document.getElementById('previaError').classList.remove('d-none');
        });
    }());
  </script>
</body>
</html>
