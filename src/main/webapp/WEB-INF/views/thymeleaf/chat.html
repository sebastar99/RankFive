<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat | Rank5</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/chat.css(v=2)}" rel="stylesheet">
</head>

<body class="chat-page">
<div class="chat-background" aria-hidden="true"></div>

<header class="chat-header">
    <nav class="container chat-navigation" aria-label="Navegaci&oacute;n principal">
        <a th:href="@{/dashboard}" class="chat-brand" aria-label="Rank5, ir al dashboard">
            <span class="chat-brand-icon"><i class="bi bi-trophy-fill" aria-hidden="true"></i></span>
            <span>Rank<span class="chat-brand-accent">5</span></span>
        </a>
        <span class="chat-navigation-title"><i class="bi bi-chat-dots" aria-hidden="true"></i> Mensajes</span>
        <a th:href="@{/dashboard}" class="chat-back-link">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Volver al dashboard</span>
        </a>
    </nav>
</header>

<main
    id="chat"
    class="chat-layout"
    th:attr="
        data-usuario-actual-id=${usuarioActualId},
        data-otro-usuario-id=${otroUsuarioId},
        data-otro-usuario-nombre=${otroUsuarioNombre},
        data-historial-url=@{/chat/{id}/mensajes(id=${otroUsuarioId})},
        data-websocket-url=@{/ws/chat}
    "
>
    <section class="chat-panel" aria-labelledby="titulo-chat">
        <header class="chat-conversation-header">
            <div class="chat-contact">
                <span class="chat-avatar" aria-hidden="true"><i class="bi bi-person"></i></span>
                <div class="chat-contact-details">
                    <p class="chat-eyebrow">Conversaci&oacute;n directa</p>
                    <h1 id="titulo-chat" th:text="${otroUsuarioNombre}">Usuario</h1>
                </div>
            </div>
            <a th:href="@{/buscar}" class="chat-secondary-link">
                <i class="bi bi-person-plus" aria-hidden="true"></i>
                <span>Buscar amigos</span>
            </a>
        </header>
        <div class="chat-connection-bar">
            <p id="estado-conexion" class="chat-connection" role="status" aria-live="polite">
                Conectando con el servidor&hellip;
            </p>
            <button id="boton-reconectar" type="button" class="chat-reconnect" hidden>
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Reconectar
            </button>
        </div>

        <div
            id="lista-mensajes"
            class="chat-messages"
            role="region"
            aria-label="Historial de mensajes"
            tabindex="0"
        >
            <p
                id="sin-mensajes"
                th:if="${#lists.isEmpty(mensajes)}"
                class="chat-empty"
            >
                Todav&iacute;a no hay mensajes en esta conversaci&oacute;n.
            </p>

            <article
                th:each="mensaje : ${mensajes}"
                class="chat-message"
                th:classappend="${mensaje.emisorId == usuarioActualId}
                    ? 'chat-message-own'
                    : 'chat-message-other'"
                th:attr="data-mensaje-id=${mensaje.id}"
            >
                <div
                    class="chat-bubble"
                >
                    <p
                        class="chat-message-author"
                        th:text="${mensaje.emisorId == usuarioActualId}
                            ? 'Vos'
                            : ${otroUsuarioNombre}"
                    >
                        Usuario
                    </p>

                    <p
                        class="chat-message-text"
                        th:text="${mensaje.contenido}"
                    >
                        Contenido del mensaje
                    </p>

                    <time
                        class="chat-message-time"
                        th:attr="datetime=${mensaje.fechaEnvio}"
                        th:text="${#strings.replace(mensaje.fechaEnvio, 'T', ' ')}"
                    >
                        Fecha del mensaje
                    </time>
                </div>
            </article>
        </div>

        <footer class="chat-composer">
            <p
                id="error-chat"
                class="chat-error"
                role="alert"
                hidden
            ></p>

            <form id="formulario-chat">
                <fieldset id="campos-chat" disabled>
                    <label for="contenido" class="chat-input-label">Tu mensaje</label>
                    <div class="chat-input-row">
                        <textarea
                            id="contenido"
                            name="contenido"
                            class="chat-input"
                            rows="2"
                            maxlength="2000"
                            placeholder="Escrib&iacute; un mensaje&hellip;"
                            aria-describedby="ayuda-mensaje"
                            required
                        ></textarea>
                        <button id="boton-enviar" type="submit" class="chat-send">
                            <span>Enviar</span>
                            <i class="bi bi-send" aria-hidden="true"></i>
                        </button>
                    </div>
                    <small id="ayuda-mensaje" class="chat-input-help">
                        <span id="contador-caracteres" class="chat-counter">2000 caracteres disponibles</span>
                        <span>Enter para una nueva l&iacute;nea.</span>
                    </small>
                </fieldset>
            </form>
            <noscript><p class="chat-error">Activ&aacute; JavaScript para enviar y recibir mensajes en tiempo real.</p></noscript>
        </footer>
    </section>
</main>
<script th:src="@{/js/chat.js(v=2)}" charset="UTF-8"></script>
</body>

</html>
