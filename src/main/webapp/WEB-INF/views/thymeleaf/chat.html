<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat | Rank5</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a
            th:href="@{/dashboard}"
            class="text-white text-decoration-none fw-bold fs-4"
        >
            Rank5
        </a>

        <a th:href="@{/buscar}" class="btn btn-outline-light">
            Buscar usuarios
        </a>
    </div>
</header>

<main
    id="chat"
    class="container py-4"
    style="max-width: 850px;"
    th:attr="
        data-usuario-actual-id=${usuarioActualId},
        data-otro-usuario-id=${otroUsuarioId},
        data-otro-usuario-nombre=${otroUsuarioNombre},
        data-historial-url=@{/chat/{id}/mensajes(id=${otroUsuarioId})},
        data-websocket-url=@{/ws/chat}
    "
>
    <section class="card shadow-sm" aria-labelledby="titulo-chat">

        <div class="card-header bg-white p-3">
            <h1 id="titulo-chat" class="h4 mb-1">
                Conversación con
                <span th:text="${otroUsuarioNombre}">Usuario</span>
            </h1>

            <p id="estado-conexion" class="text-muted small mb-0" role="status">
                Envío de mensajes todavía no habilitado.
            </p>
            <button
                id="boton-reconectar"
                type="button"
                class="btn btn-sm btn-outline-primary mt-2"
                hidden
            >
                Reconectar
            </button>
        </div>

        <div
            id="lista-mensajes"
            class="card-body overflow-auto"
            style="height: 420px;"
            role="region"
            aria-label="Historial de mensajes"
            tabindex="0"
        >
            <p
                id="sin-mensajes"
                th:if="${#lists.isEmpty(mensajes)}"
                class="text-center text-muted py-5"
            >
                Todavía no hay mensajes en esta conversación.
            </p>

            <article
                th:each="mensaje : ${mensajes}"
                class="d-flex mb-3"
                th:classappend="${mensaje.emisorId == usuarioActualId}
                    ? 'justify-content-end'
                    : 'justify-content-start'"
                th:attr="data-mensaje-id=${mensaje.id}"
            >
                <div
                    class="rounded p-3"
                    style="max-width: 80%; overflow-wrap: anywhere;"
                    th:classappend="${mensaje.emisorId == usuarioActualId}
                        ? 'bg-primary text-white'
                        : 'bg-light border'"
                >
                    <p
                        class="fw-bold small mb-1"
                        th:text="${mensaje.emisorId == usuarioActualId}
                            ? 'Vos'
                            : ${otroUsuarioNombre}"
                    >
                        Usuario
                    </p>

                    <p
                        class="mb-2"
                        style="white-space: pre-wrap;"
                        th:text="${mensaje.contenido}"
                    >
                        Contenido del mensaje
                    </p>

                    <time
                        class="small"
                        th:attr="datetime=${mensaje.fechaEnvio}"
                        th:text="${#strings.replace(mensaje.fechaEnvio, 'T', ' ')}"
                    >
                        Fecha del mensaje
                    </time>
                </div>
            </article>
        </div>

        <div class="card-footer bg-white p-3">
            <p
                id="error-chat"
                class="alert alert-danger"
                role="alert"
                hidden
            ></p>

            <form id="formulario-chat">
                <fieldset id="campos-chat" disabled>
                    <label for="contenido" class="form-label">
                        Tu mensaje
                    </label>

                    <textarea
                        id="contenido"
                        name="contenido"
                        class="form-control"
                        rows="3"
                        maxlength="2000"
                        placeholder="Escribí un mensaje..."
                        aria-describedby="ayuda-mensaje"
                        required
                    ></textarea>

                    <div
                        class="d-flex justify-content-between align-items-center gap-3 mt-2"
                    >
                        <small id="ayuda-mensaje" class="text-muted">
                            Máximo 2000 caracteres.
                        </small>

                        <button
                            id="boton-enviar"
                            type="submit"
                            class="btn btn-primary"
                        >
                            Enviar
                        </button>
                    </div>
                </fieldset>
            </form>
        </div>

    </section>
</main>
<script th:src="@{/js/chat.js}"></script>
</body>

</html>
