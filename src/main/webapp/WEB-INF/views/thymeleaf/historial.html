<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Historial | Rank5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css(v=14)}" />
</head>
<body class="dashboard-page">
  <div class="pitch-bg"></div>

  <header class="db-header fixed-top">
    <div class="container">
      <div class="db-header-content">
        <div class="db-left d-flex align-items-center gap-2">
          <a th:href="@{/dashboard}" class="db-brand">
            <span class="db-brand-logo"><i class="bi bi-trophy-fill"></i></span>
            <span class="db-brand-text">Rank<span class="db-brand-accent">5</span></span>
          </a>
        </div>
        <div class="db-center d-flex align-items-center gap-2">
          <span class="db-page-title"><i class="bi bi-clock-history"></i>Historial</span>
        </div>
        <div class="db-right d-flex align-items-center gap-4">
          <div th:replace="~{fragments/notificaciones :: campana}"></div>
          <span class="db-divider"></span>
          <a th:href="@{/dashboard}" class="db-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container db-content">
    <section class="card-glass p-4 mb-4">
      <h1 class="h5 mb-3">Resumen de partidos</h1>
      <div class="history-stats">
        <div class="mini-stat text-center">
          <div class="label"><i class="bi bi-controller me-1"></i>Jugados</div>
          <div class="stat" th:text="${jugados}">0</div>
        </div>
        <div class="mini-stat text-center">
          <div class="label"><i class="bi bi-check-circle me-1"></i>Ganados</div>
          <div class="stat" th:text="${ganados}">0</div>
        </div>
        <div class="mini-stat text-center">
          <div class="label"><i class="bi bi-dash-circle me-1"></i>Empatados</div>
          <div class="stat" th:text="${empatados}">0</div>
        </div>
        <div class="mini-stat text-center">
          <div class="label"><i class="bi bi-x-circle me-1"></i>Perdidos</div>
          <div class="stat" th:text="${perdidos}">0</div>
        </div>
        <div class="mini-stat text-center">
          <div class="label"><i class="bi bi-percent me-1"></i>Efectividad</div>
          <div class="stat" th:text="${efectividad} + '%'">0%</div>
        </div>
      </div>
    </section>

    <section class="card-glass p-4">
      <h2 class="h5 mb-3">Últimos partidos</h2>
      <div class="ranking-list">
        <div class="history-item" th:each="p : ${historial}"
             th:with="
               soyA=${#sets.contains(p.equipoA, usuario)},
               soyB=${#sets.contains(p.equipoB, usuario)},
               res=${p.fueJugado()} ?
                    (${p.golesEquipoA == p.golesEquipoB} ? 'E' :
                      (soyA ? (${p.golesEquipoA > p.golesEquipoB} ? 'V' : 'D')
                            : (${p.golesEquipoB > p.golesEquipoA} ? 'V' : 'D')))
                    : 'E',
               delta=${deltas[p.id]}">
          <div class="result-chip"
               th:classappend="${res == 'V'} ? ' result-v' : (${res == 'D'} ? ' result-d' : ' result-e')"
               th:text="${res}">V</div>
          <div class="history-info">
            <div class="history-teams">
              Equipo A
              <span th:each="j, it : ${p.equipoA}">
                <span th:text="${j.perfil.nombreUsuario} ?: ${j.email}">jugador</span><span th:if="${!it.last}">, </span>
              </span>
              <span class="text-muted fw-normal" th:text="${' ' + p.golesEquipoA + ' - ' + p.golesEquipoB + ' '}">0 - 0</span>
              Equipo B
              <span th:each="j, it : ${p.equipoB}">
                <span th:text="${j.perfil.nombreUsuario} ?: ${j.email}">jugador</span><span th:if="${!it.last}">, </span>
              </span>
            </div>
            <div class="history-meta"><i class="bi bi-calendar-event me-1"></i>
              <span th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span>
            </div>
          </div>
          <div class="history-pl"
               th:classappend="${delta != null and delta >= 0} ? ' up' : ' down'"
               th:text="${(delta != null ? (delta >= 0 ? '+' : '') : '') + (delta != null ? delta : 0)} + ' PL'">+0 PL</div>
        </div>

        <div class="ranking-empty" th:if="${#lists.isEmpty(historial)}">
          <i class="bi bi-dribbble"></i>
          <p class="m-0">Todavía no jugaste ningún partido.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
