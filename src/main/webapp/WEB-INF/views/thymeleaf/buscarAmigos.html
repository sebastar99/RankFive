<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Buscar amigos | Rank5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>
<body class="dashboard-page">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 text-light m-0">Buscar amigos</h1>
      <div class="d-flex align-items-center gap-3">
        <div th:replace="~{fragments/notificaciones :: campana}"></div>
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Volver al dashboard
        </a>
      </div>
    </div>

    <form class="card-glass p-3 mb-4" th:action="@{/buscar}" method="get">
      <div class="row g-2 align-items-center">
        <div class="col-sm-8">
          <input class="form-control" type="text" name="nombreUsuario" placeholder="Nombre de usuario" required>
        </div>
        <div class="col-sm-4">
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search me-1"></i> Buscar</button>
        </div>
      </div>
    </form>

    <div th:if="${amigo != null}" class="card-glass p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="text-light fw-semibold" th:text="${amigo.perfil.nombreCompleto} ?: ${amigo.email}">Nombre</div>
          <div class="text-secondary" th:text="'@' + (${amigo.perfil.nombreUsuario} ?: 'usuario')">@usuario</div>
          <div class="text-secondary">Puntos: <span th:text="${amigo.perfil.pl} ?: 0">0</span></div>
        </div>
        <form th:action="@{/enviar-solicitud}" method="post" class="m-0">
          <input type="hidden" name="nombreUsuario" th:value="${amigo.perfil.nombreUsuario}">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-person-plus me-1"></i> Enviar solicitud
          </button>
        </form>
      </div>
    </div>

    <div th:if="${error != null}" class="alert alert-warning">[[${error}]]</div>
    <div th:if="${ok != null}" class="alert alert-success">[[${ok}]]</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
