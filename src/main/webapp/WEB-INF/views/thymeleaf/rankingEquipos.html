<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ranking de equipos | Rank5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css(v=20)}" />
</head>
<body class="dashboard-page">
  <div class="pitch-bg"></div>

  <header class="db-header fixed-top">
    <div class="container">
      <div class="db-header-content">
        <div class="db-left d-flex align-items-center gap-2">
          <a th:href="@{/dashboard}" class="db-brand">
            <span class="db-brand-logo"><i class="bi bi-trophy-fill"></i></span>
            <span class="db-brand-text">Rank<span class="db-brand-accent">5</span></span>
          </a>
        </div>
        <div class="db-center d-flex align-items-center gap-2">
          <span class="db-page-title"><i class="bi bi-bar-chart-line-fill"></i>Ranking de equipos</span>
        </div>
        <div class="db-right d-flex align-items-center gap-4">
          <div th:replace="~{fragments/notificaciones :: campana}"></div>
          <span class="db-divider"></span>
          <a th:href="@{/dashboard}" class="db-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container db-content">
    <section class="card-glass p-4">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="h5 m-0">Ranking general de equipos</h1>
          <p class="text-muted small m-0 mt-1">Top 10 por puntaje promedio de sus integrantes.</p>
        </div>
        <a th:href="@{/agregar-equipo}" class="btn btn-primary btn-action">
          <i class="bi bi-people-fill me-2"></i>Crear equipo
        </a>
      </div>

      <div class="ranking-list">
        <div class="notif-empty" th:if="${#lists.isEmpty(ranking)}">
          <i class="bi bi-inbox"></i>
          <span>Todavía no hay equipos activos</span>
        </div>
        <th:block th:each="fila, st : ${ranking}">
          <div class="text-muted small text-uppercase fw-bold mt-3 mb-1"
               th:if="${st.index == topRanking and fila.posicion > topRanking}">Tus equipos</div>
          <div class="team-rank-row" th:classappend="${fila.propio} ? 'mine' : ''">
            <div class="pos" th:classappend="${fila.posicion <= 3} ? 'top' : ''" th:text="${fila.posicion}">1</div>
            <div class="team-shield">
              <img th:if="${fila.equipo.fotoUrl != null}" th:src="@{${fila.equipo.fotoUrl}}" th:alt="${fila.equipo.nombre}" class="team-rank-icon lg" />
              <i th:if="${fila.equipo.fotoUrl == null}" class="bi bi-shield-fill"></i>
            </div>
            <div class="name">
              <span th:text="${fila.equipo.nombre}">Equipo</span>
              <span class="username">
                <span th:text="${#lists.size(fila.equipo.jugadores)}">5</span> jugadores · F<span th:text="${fila.equipo.formato}">5</span>
                <th:block th:if="${fila.propio}"> · <span class="text-primary">Tu equipo</span></th:block>
              </span>
            </div>
            <div class="points">
              <span class="rank-badge rank-badge-sm team-rank-badge" th:classappend="'team-rank-' + ${fila.equipo.rango.slug}" title="Promedio del equipo">
                <img class="team-rank-icon lg" th:src="@{${fila.equipo.rangoIcono}}" th:alt="${fila.equipo.rango.nombre}" />
                <span th:text="${fila.equipo.rango.nombre}">Rango</span>
              </span>
              <span th:text="${fila.equipo.promedioPl} + ' pts'">0 pts</span>
            </div>
          </div>
        </th:block>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
